[project]
name = "multi-agent-ai-rag"
version = "0.1.0"
description = "Multi-agent AI system with LangGraph, FastAPI, and Streamlit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.3.0,<2.0",
    "langgraph>=1.2.0,<2.0",
    "langchain-groq>=0.3.0",
    "langchain-community>=0.3.0",
    "tavily-python>=0.5.0",
    "fastapi>=0.115.0,<1.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.44.0",
    "pydantic>=2.7.0,<3.0",
    "uvicorn>=0.30.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "bandit>=1.7.9",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bandit]
targets = ["src"]
skips = ["B101"]