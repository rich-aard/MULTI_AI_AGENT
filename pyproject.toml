[project]
name = "multi-agent-ai-rag"
version = "0.1.0"
description = "Multi-agent AI system with LangGraph, FastAPI, and Streamlit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain >=1.3.0,<2.0",
    "langgraph >=1.2.0,<2.0",
    "langchain-groq >=0.3.0",
    "langchain-community >=0.3.0",
    "tavily-python >=0.5.0",
    "fastapi >=0.115.0,<1.0",
    "python-dotenv >=1.0.1",
    "streamlit >=1.44.0",
    "pydantic >=2.7.0,<3.0",
    "uvicorn >=0.30.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"] 
